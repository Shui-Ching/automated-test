<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>頁面列表 — 頁面管理功能模擬</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <div class="pub-page">
        <header class="pub-topbar">
            <div class="pub-topbar-inner">
                <a class="pub-logo" href="index.html" data-testid="pub-logo">
                    <span class="pub-logo-mark" aria-hidden="true"></span>
                    <span class="pub-logo-text">頁面管理<span class="pub-logo-text-em">模擬站</span></span>
                </a>
                <!-- 前台不提供任何後台入口（NFR-003），此處只放中性的版本標記，不放登入／登出 -->
                <p class="pub-topbar-meta">模擬資料版本 v1.2</p>
            </div>
        </header>

        <main class="pub-main pub-list">
            <div class="pub-list-intro">
                <h1 class="pub-list-heading">頁面列表</h1>
                <p class="pub-list-lead">目前站上公開的所有頁面，依建立日期由新到舊排列。</p>
            </div>
            <div class="pub-list-table-wrap">
                <table class="table">
                    <thead>
                        <tr>
                            <th>序號</th>
                            <th>頁面名稱</th>
                            <th>建立日期</th>
                        </tr>
                    </thead>
                    <tbody class="js-table-body" data-testid="pub-list-body"></tbody>
                </table>
            </div>

            <div class="pub-list-pagination">
                <div class="pub-list-pagination-size">
                    <label for="pub-list-page-size">每頁</label>
                    <select class="field-input js-page-size" id="pub-list-page-size" data-testid="pub-list-page-size">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                    <span>筆，共 <span class="js-total" data-testid="pub-list-total">0</span> 筆</span>
                </div>

                <div class="pub-list-pagination-nav">
                    <button type="button" class="button button--secondary js-page-prev" data-testid="pub-list-page-prev">上一頁</button>
                    <input
                        class="field-input js-page-input"
                        type="number"
                        min="1"
                        aria-label="跳至頁數"
                        data-testid="pub-list-page-input">
                    <span class="js-page-total" data-testid="pub-list-page-total">/ 1</span>
                    <button type="button" class="button button--secondary js-page-next" data-testid="pub-list-page-next">下一頁</button>
                </div>
            </div>
        </main>

        <footer class="pub-site-footer">
            <div class="pub-site-footer-inner">
                <section class="pub-site-footer-section">
                    <h2 class="pub-site-footer-heading">關於本站</h2>
                    <p class="pub-site-footer-text">
                        「頁面管理功能」規格的前台展示站。所有頁面資料存放在瀏覽器本機，
                        清除瀏覽器資料即回到初始狀態。
                    </p>
                </section>

                <section class="pub-site-footer-section">
                    <h2 class="pub-site-footer-heading">瀏覽</h2>
                    <ul class="pub-site-footer-list">
                        <li><a class="pub-site-footer-link" href="index.html">頁面列表</a></li>
                    </ul>
                </section>

                <section class="pub-site-footer-section">
                    <h2 class="pub-site-footer-heading">版本資訊</h2>
                    <p class="pub-site-footer-text">
                        模擬資料 v1.2<br>
                        依 SRS 前台展示規格建置<br>
                        僅供自動化驗收試作使用
                    </p>
                </section>
            </div>

            <p class="pub-site-footer-bottom">頁面管理模擬站 — 非正式營運站台，內容為測試用假資料</p>
        </footer>
    </div>

    <script type="module" src="assets/js/pub-list.js"></script>
</body>
</html>
