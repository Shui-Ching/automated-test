<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>頁面內容 — 頁面管理功能模擬</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <div class="pub-page">
        <header class="pub-topbar">
            <div class="pub-topbar-inner">
                <a class="pub-logo" href="index.html" data-testid="pub-logo">
                    <span class="pub-logo-mark" aria-hidden="true"></span>
                    <span class="pub-logo-text">頁面管理<span class="pub-logo-text-em">模擬站</span></span>
                </a>
                <!-- 前台不提供任何後台入口（NFR-003），此處只放中性的版本標記，不放登入／登出 -->
                <p class="pub-topbar-meta">模擬資料版本 v1.1</p>
            </div>
        </header>

        <main class="pub-main pub-detail">
            <p class="toast js-toast" role="status" data-testid="pub-detail-toast" hidden></p>

            <header class="pub-detail-header">
                <h1 class="pub-detail-title js-name" data-testid="pub-detail-name"></h1>
                <p class="pub-detail-date js-date" data-testid="pub-detail-date"></p>
            </header>

            <div class="pub-detail-blocks js-blocks" data-testid="pub-detail-blocks"></div>

            <div class="pub-detail-content js-content-section" data-testid="pub-detail-content-section" hidden>
                <div class="pub-detail-content-body js-content" data-testid="pub-detail-content"></div>
            </div>

            <div class="pub-detail-note js-note-section" data-testid="pub-detail-note-section" hidden>
                <p class="pub-detail-note-body js-note" data-testid="pub-detail-note"></p>
            </div>

            <footer class="pub-detail-footer">
                <a class="button button--secondary pub-detail-footer-prev js-prev" data-testid="pub-detail-prev" hidden></a>
                <a class="button button--secondary pub-detail-footer-return" href="index.html" data-testid="pub-detail-return">返回列表</a>
                <a class="button button--secondary pub-detail-footer-next js-next" data-testid="pub-detail-next" hidden></a>
            </footer>
        </main>

        <footer class="pub-site-footer">
            <div class="pub-site-footer-inner">
                <section class="pub-site-footer-section">
                    <h2 class="pub-site-footer-heading">關於本站</h2>
                    <p class="pub-site-footer-text">
                        「頁面管理功能」規格的前台展示站。所有頁面資料存放在瀏覽器本機，
                        清除瀏覽器資料即回到初始狀態。
                    </p>
                </section>

                <section class="pub-site-footer-section">
                    <h2 class="pub-site-footer-heading">瀏覽</h2>
                    <ul class="pub-site-footer-list">
                        <li><a class="pub-site-footer-link" href="index.html">頁面列表</a></li>
                    </ul>
                </section>

                <section class="pub-site-footer-section">
                    <h2 class="pub-site-footer-heading">版本資訊</h2>
                    <p class="pub-site-footer-text">
                        模擬資料 v1.1<br>
                        依 SRS 前台展示規格建置<br>
                        僅供自動化驗收試作使用
                    </p>
                </section>
            </div>

            <p class="pub-site-footer-bottom">頁面管理模擬站 — 非正式營運站台，內容為測試用假資料</p>
        </footer>
    </div>

    <script type="module" src="assets/js/pub-detail.js"></script>
</body>
</html>
